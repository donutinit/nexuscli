[project]
name = "nexuscli"
version = "0.3.0"
description = "Nexus y SIASE de la UANL desde la terminal: tareas, entregas en equipo, comentarios, material de cada materia, AFIs con cupo, kardex y horario."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Von Diego" }]
requires-python = ">=3.12"
keywords = ["uanl", "nexus", "siase", "afi", "cli", "escuela", "agentes"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Spanish",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx==0.28.1",
]

[project.urls]
Repositorio = "https://github.com/donutinit/nexuscli"
API = "https://github.com/donutinit/nexuscli/blob/main/docs/api.md"
SIASE = "https://github.com/donutinit/nexuscli/blob/main/docs/siase.md"

[project.scripts]
nexuscli = "nexuscli.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexuscli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
